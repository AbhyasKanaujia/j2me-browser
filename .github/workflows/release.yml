name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: make setup
      - run: make build
      # Asset names are fixed (not versioned) so the GitHub Pages landing
      # page (docs/index.html) can link to
      # .../releases/latest/download/j2me-browser.jad without needing to
      # know the current version.
      - name: Point MIDlet-Jar-URL at the hosted jar
        run: |
          sed -i 's#^MIDlet-Jar-URL:.*#MIDlet-Jar-URL: https://github.com/AbhyasKanaujia/j2me-browser/releases/latest/download/j2me-browser.jar#' app.jad
      - run: cp dist/app.jar j2me-browser.jar
      - run: cp app.jad j2me-browser.jad
      - uses: actions/upload-artifact@v4
        with:
          name: j2me-browser
          path: |
            j2me-browser.jar
            j2me-browser.jad
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" j2me-browser.jar j2me-browser.jad --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
